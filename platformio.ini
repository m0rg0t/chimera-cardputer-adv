[platformio]
default_envs = cardputer-adv

[env:cardputer-adv]
platform = espressif32@7.1.3
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<preview/>
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    m5stack/M5Unified@0.2.17
    https://github.com/m5stack/M5GFX.git#0.2.22
    https://github.com/m5stack/M5Cardputer.git#1.2.0
    z3t0/IRremote@4.7.1

[env:screen-preview]
platform = native
build_src_filter =
    -<*>
    +<head.cpp>
    +<screen.cpp>
    +<preview/screen_preview.cpp>
lib_deps = https://github.com/m5stack/M5GFX.git#0.2.22
build_flags =
    -std=c++17
    !sdl2-config --cflags
    !sdl2-config --libs
